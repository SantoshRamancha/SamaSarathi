# Local development services. Start with: docker compose up -d
services:
  postgres:
    # PostGIS = PostgreSQL + geo functions (find drivers within N km)
    image: postgis/postgis:16-3.4
    container_name: samasarathi-pg
    environment:
      POSTGRES_DB: samasarathi
      POSTGRES_USER: samasarathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    # Live driver locations (GEOADD / GEOSEARCH) and short-lived cache
    image: redis:7
    container_name: samasarathi-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
